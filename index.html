<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a0d" />
    <meta name="description" content="MT LEGIT Web — criação de sites, experiências digitais e tecnologia para negócios." />
    <title>MT LEGIT Web — Tecnologia para negócios</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23090a0d'/%3E%3Cpath d='M14 45V19h6l12 14 12-14h6v26h-7V30L32 42 21 30v15z' fill='%23ef4444'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="stylesheet" href="./overview.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
        <a class="brand" href="#overview" aria-label="MT LEGIT Web, início">
          <span class="brand-mark"><img src="./assets/mt-legit-mark.png" alt="" /></span>
        </a>
        <div class="workspace-switch"><span class="workspace-avatar"><img src="./assets/mt-legit-avatar.png" alt="" /></span><span><strong>MT LEGIT Web</strong><small>Workspace inicial</small></span><span class="chevron">⌄</span></div>
        <div class="nav-caption">ESPAÇO DE TRABALHO</div>
        <nav class="primary-nav" id="primary-nav">
          <button class="nav-item active" data-page="overview"><span class="nav-icon" data-icon="grid"></span><span>Visão geral</span><span class="nav-pip"></span></button>
          <button class="nav-item" data-page="leads"><span class="nav-icon" data-icon="target"></span><span>Leads</span><span class="nav-count" id="lead-count"></span></button>
          <button class="nav-item" data-page="clients"><span class="nav-icon" data-icon="users"></span><span>Clientes</span></button>
          <button class="nav-item" data-page="projects"><span class="nav-icon" data-icon="layers"></span><span>Projetos</span></button>
          <button class="nav-item" data-page="quotes"><span class="nav-icon" data-icon="file"></span><span>Orçamentos</span></button>
          <button class="nav-item" data-page="invoices"><span class="nav-icon" data-icon="receipt"></span><span>Faturas</span><span class="nav-alert" id="invoice-alert" style="display:none"></span></button>
          <div class="nav-caption nav-caption-spaced">OPERAÇÃO</div>
          <button class="nav-item" data-page="services"><span class="nav-icon" data-icon="refresh"></span><span>Recorrências</span></button>
          <button class="nav-item" data-page="domains"><span class="nav-icon" data-icon="globe"></span><span>Domínios e hospedagem</span></button>
          <button class="nav-item" data-page="tasks"><span class="nav-icon" data-icon="check"></span><span>Tarefas</span></button>
          <button class="nav-item" data-page="calendar"><span class="nav-icon" data-icon="calendar"></span><span>Calendário</span></button>
          <button class="nav-item" data-page="files"><span class="nav-icon" data-icon="folder"></span><span>Arquivos</span></button>
          <button class="nav-item" data-page="revenue"><span class="nav-icon" data-icon="chart"></span><span>Receitas</span></button>
          <button class="nav-item" data-page="expenses"><span class="nav-icon" data-icon="wallet"></span><span>Despesas</span></button>
          <button class="nav-item" data-page="reports"><span class="nav-icon" data-icon="chart"></span><span>Relatórios</span></button>
        </nav>
        <div class="sidebar-bottom">
          <div class="side-help"><span class="help-orb">✳</span><div><strong>Seu estúdio começa aqui</strong><small>Cadastre o primeiro serviço</small></div><span class="side-arrow">↗</span></div>
          <button class="nav-item settings-item" data-page="settings"><span class="nav-icon" data-icon="settings"></span><span>Configurações</span></button>
          <div class="profile-row"><span class="profile-avatar"><img src="./assets/mt-legit-avatar.png" alt="" /></span><span class="profile-name"><strong>MT LEGIT Web</strong><small>Estúdio digital</small></span><button class="icon-button profile-menu" data-page="settings" aria-label="Abrir configurações">···</button></div>
        </div>
      </aside>
      <div class="sidebar-scrim" id="sidebar-scrim"></div>
      <main class="main-area">
        <header class="topbar">
          <div class="topbar-left"><button class="icon-button mobile-menu" id="mobile-menu" aria-label="Abrir menu"><span data-icon="menu"></span></button><div class="breadcrumbs"><span>Meu estúdio</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Visão geral</strong></div></div>
          <div class="topbar-actions">
            <label class="search-box"><span data-icon="search"></span><input id="global-search" type="search" placeholder="Buscar em tudo..." autocomplete="off" /><kbd>⌘ K</kbd></label>
            <button class="icon-button notification-button" id="notification-button" aria-label="Notificações"><span data-icon="bell"></span><i></i></button>
            <span class="top-divider"></span>
            <button class="top-profile" id="top-profile" data-page="settings"><span class="profile-avatar profile-avatar-sm"><img src="./assets/mt-legit-avatar.png" alt="" /></span><span>Meu perfil</span><span class="chevron">⌄</span></button>
          </div>
        </header>
        <div class="demo-strip workspace-strip"><span class="demo-dot"></span><strong>Workspace novo</strong><span>Sua operação começa sem registros.</span></div>
        <section class="page-content" id="page-content" aria-live="polite"></section>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="./app.js" defer></script>
    <script src="./admin-enhancements.js" defer></script>
    <script src="./admin-workflows.js" defer></script>
  </body>
</html>
